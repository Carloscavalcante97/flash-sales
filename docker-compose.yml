services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flash
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash"]
      interval: 2s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
